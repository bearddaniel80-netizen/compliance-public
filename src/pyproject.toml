[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aql_compliance"
version = "0.1.0"
description = "AQL Compliance Framework"
authors = [{ name = "Daniel Beard" }]
requires-python = ">=3.10"
dependencies = [ "arrow", "duckdb", "typer" ]

[project.scripts]
compliance = "aql_compliance.cli:app"